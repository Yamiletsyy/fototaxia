<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Protocolo de Fototaxia</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
}

#pantalla {
    position: fixed;
    inset: 0;
    background: white;
}

#negro {
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    background: black;
    display: none;
}

#inicio {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    z-index: 10;
}

button {
    font-size: 36px;
    padding: 25px 50px;
    border-radius: 18px;
    border: none;
    background: #007AFF;
    color: white;
}
</style>
</head>

<body>

<div id="inicio">
    <button onclick="iniciar()">Iniciar protocolo</button>
</div>

<div id="pantalla">
    <div id="negro"></div>
</div>

<script>

const DURACION_BLANCO = 5 * 60 * 1000; // 5 minutos
const DURACION_MITAD = 5 * 60 * 1000;  // 5 minutos

let inicio;

function iniciar(){

    document.getElementById("inicio").style.display = "none";

    // Intentar pantalla completa
    if(document.documentElement.requestFullscreen){
        document.documentElement.requestFullscreen();
    }

    inicio = Date.now();

    actualizar();
}

function actualizar(){

    const t = Date.now() - inicio;

    if(t < DURACION_BLANCO){

        document.body.style.background = "white";
        document.getElementById("negro").style.display = "none";

    }
    else if(t < DURACION_BLANCO + DURACION_MITAD){

        document.body.style.background = "white";
        document.getElementById("negro").style.display = "block";

    }
    else{

        document.getElementById("negro").style.display = "none";
        document.body.style.background = "white";

        alert("Protocolo finalizado.");
        return;
    }

    requestAnimationFrame(actualizar);
}

</script>

</body>
</html>

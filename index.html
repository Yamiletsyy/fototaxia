<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Prueba Fototaxia</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#pantalla{
    position:fixed;
    inset:0;
    background:white;
}

#negro{
    position:absolute;
    top:0;
    right:0;
    width:50%;
    height:100%;
    background:black;
    display:none;
}

#inicio{
    position:fixed;
    inset:0;
    background:#bfbfbf;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:100;
}

h1{
    color:black;
    margin-bottom:30px;
}

button{
    font-size:32px;
    padding:20px 40px;
    border:none;
    border-radius:12px;
    background:#0066ff;
    color:white;
    cursor:pointer;
}

#contador{
    margin-top:25px;
    font-size:28px;
    color:black;
}
</style>
</head>

<body>

<div id="inicio">
    <h1>Prueba del protocolo</h1>
    <button id="btn">INICIAR</button>
    <div id="contador"></div>
</div>

<div id="pantalla">
    <div id="negro"></div>
</div>

<script>

const blanco = 5000; // 5 segundos para probar
const mitad  = 5000; // 5 segundos para probar

const btn = document.getElementById("btn");
const inicio = document.getElementById("inicio");
const negro = document.getElementById("negro");
const contador = document.getElementById("contador");

let t0 = 0;

btn.onclick = () => {
    inicio.style.display = "none";
    t0 = performance.now();
    requestAnimationFrame(actualizar);
};

function actualizar(){

    let t = performance.now() - t0;

    if(t < blanco){

        negro.style.display = "none";

    }else if(t < blanco + mitad){

        negro.style.display = "block";

    }else{

        alert("Fin de la prueba");
        return;

    }

    requestAnimationFrame(actualizar);

}

</script>

</body>
</html>

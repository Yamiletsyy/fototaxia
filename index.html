<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fototaxia iPad</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

#pantalla{
    width:100%;
    height:100%;
    background:#cccccc;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Arial;
}

#negro{
    position:fixed;
    top:0;
    right:0;
    width:50%;
    height:100%;
    background:black;
    display:none;
}

h1{
    font-size:40px;
}

p{
    font-size:30px;
}

</style>

</head>

<body>

<div id="pantalla">
    <h1>TOCA PARA INICIAR</h1>
    <p>Protocolo de fototaxia</p>
</div>

<div id="negro"></div>


<script>

let iniciado=false;
let tiempoInicio;

const faseBlanca=5 * 60 * 1000; // prueba: 5 segundos
const faseMitad=5 * 60 * 1000;  // prueba: 5 segundos


document.addEventListener("touchstart", iniciar);
document.addEventListener("click", iniciar);


function iniciar(){

    if(iniciado) return;

    iniciado=true;

    document.getElementById("pantalla").style.display="none";

    tiempoInicio=Date.now();

    actualizar();

}


function actualizar(){

    let tiempo=Date.now()-tiempoInicio;

    if(tiempo < faseBlanca){

        document.getElementById("negro").style.display="none";

    }
    else if(tiempo < faseBlanca+faseMitad){

        document.getElementById("negro").style.display="block";

    }
    else{

        document.body.style.background="white";
        return;

    }

    requestAnimationFrame(actualizar);

}

</script>

</body>
</html>

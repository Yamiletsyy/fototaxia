<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fototaxia</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
}

#pantalla{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:white;
}

#negro{
position:absolute;
right:0;
top:0;
width:50%;
height:100%;
background:black;
display:none;
}

#inicio{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:#d9d9d9;
z-index:100;
}

button{
font-size:40px;
padding:30px 60px;
background:#0066ff;
color:white;
border:none;
border-radius:15px;
}
</style>
</head>

<body>

<div id="inicio">
<button id="btn">INICIAR PROTOCOLO</button>
</div>

<div id="pantalla">
<div id="negro"></div>
</div>

<script>

const blanco=5*60*1000;
const mitad=5*60*1000;

let t0=null;

document.getElementById("btn").onclick=function(){

document.getElementById("inicio").style.display="none";

t0=performance.now();

requestAnimationFrame(loop);

}

function loop(){

let t=performance.now()-t0;

if(t<blanco){

document.getElementById("negro").style.display="none";

}else if(t<blanco+mitad){

document.getElementById("negro").style.display="block";

}else{

document.getElementById("negro").style.display="none";
return;

}

requestAnimationFrame(loop);

}

</script>

</body>
</html>
